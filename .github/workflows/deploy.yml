name: Deploy to Cloudflare Pages

# ATTENTION : GitHub ne declenche aucun workflow sur un push authentifie par
# GITHUB_TOKEN. Le bot d'articles doit donc appeler wrangler lui-meme.
# Et un run declenche par un push ancien peut s'executer APRES un dispatch
# plus recent et republier une vieille version : verifier le contenu servi,
# jamais seulement le statut du run.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy . --project-name=meilleur-poele-granules --branch=main
